name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installs the pnpm version from package.json's packageManager field.
      # pnpm then downloads Node 24 itself (devEngines.runtime).
      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Check migrations
        run: pnpm db:check

      - name: Unit tests
        run: pnpm test

      # Starts a throwaway Postgres with Docker Compose (preinstalled on the runner).
      - name: Database tests
        run: pnpm test:db
