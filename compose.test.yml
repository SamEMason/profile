# Throwaway Postgres for `pnpm test:db`. Started and removed by tests/db/setup.ts.
# A separate project name keeps it away from the real `profile` data volume.
name: profile-test

services:
  db:
    image: postgres:18
    environment:
      # Fixed, non-secret credentials: this database only ever holds test data.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: profile_test
    ports:
      # 5433, so it never clashes with the real database on 5432.
      - "127.0.0.1:5433:5432"
    # Data lives in memory only: faster, and gone when the container is removed.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 30
